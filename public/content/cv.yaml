# ─────────────────────────────────────────────────────────────────────────────
# CV — Curriculum Vitae sections.
#
# Each top-level key is a section. Each section has:
#   - title: shown as the section heading
#   - items: list of { when, where, what, note? }
#
# `skills` is a special section rendered as a multi-line block.
#
# Order of keys here = order on the page.
# ─────────────────────────────────────────────────────────────────────────────

education:
  title: Education
  items:
    - when: "2025 –"
      where: Purdue University
      what: "Ph.D., Computer Science"
      note: "[Advised by Fengqing Maggie Zhu. Working on [research area].]"
    - when: "[Year]"
      where: "[Undergraduate university]"
      what: "B.S., [Major]"
      note: "[GPA, honors, thesis title — fill in.]"

experience:
  title: Experience
  items:
    - when: "[Summer 2026]"
      where: "[Company / lab]"
      what: Research Intern
      note: "[Placeholder description of what you worked on.]"
    - when: "[Year]"
      where: "[Company / lab]"
      what: "[Role]"
      note: "[Placeholder description.]"

awards:
  title: Awards
  items:
    - when: "[Year]"
      where: "[Granting institution]"
      what: "[Award name]"
    - when: "[Year]"
      where: "[Conference]"
      what: "[Award name]"

teaching:
  title: Teaching
  items:
    - when: "[Term]"
      where: Purdue
      what: "[Course code] · [TA / Instructor]"

# Service — hidden for now. Uncomment to show it on the CV page and Research page.
# service:
