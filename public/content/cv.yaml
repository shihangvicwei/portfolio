    #   what: Oral presentation

# Free-form skills block. Each line is rendered with bold heading + description.
skills:
  title: Skills
  lines:
    - heading: Languages
      text: "Python, C++, [other]"
    - heading: Frameworks
      text: "PyTorch, JAX, [other]"
    - heading: Other
      text: "[LaTeX, distributed training, etc.]"
