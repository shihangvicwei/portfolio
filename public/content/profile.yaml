  - "My research interests are in 3D and 4D reconstruction, with a focus on building solid, high-fidelity dynamic 3D/4D 
  models efficiently. I am especially interested in approaches that can reduce reconstruction time while preserving 
  quality and reducing the model storage size, whether through feed-forward methods, per-scene optimization, or hybrid 
  systems.
  
  I also love photography and hiking, check out my instagram to see my lastest work.
