<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Moved to shihangvicwei.github.io</title>
<!-- 404.html: same redirect for any deeper /portfolio/... path.
     The site moved from /portfolio/ to the domain root on 2026-10-03.
     GitHub Pages can't send a server-side 301, so this page does the next
     best thing: an instant meta refresh (Google treats a 0-second refresh as
     a permanent redirect) plus a canonical pointing at the new URL. The script
     runs first so in-app links like #/research keep their section. -->
<link rel="canonical" href="https://shihangvicwei.github.io/" />
<script>location.replace('https://shihangvicwei.github.io/' + location.hash);</script>
<meta http-equiv="refresh" content="0; url=https://shihangvicwei.github.io/" />
</head>
<body>
<p>This site has moved to <a href="https://shihangvicwei.github.io/">shihangvicwei.github.io</a>.</p>
</body>
</html>
